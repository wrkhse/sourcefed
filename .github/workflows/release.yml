name: Release

# A tag such as v0.4.2 names a final release: `publish` stages @wrkhse/sourcefed
# on npm, and a maintainer approves it with 2FA on npmjs.com (Staged Packages)
# or with `npm stage approve`, which publishes it. npm trusted publishing
# authenticates this workflow (release.yml) with OIDC and adds provenance;
# NPM_TOKEN, a granular publish token, is the fallback.
#
# A tag with a `-`, such as v0.6.0-rc.1, names a release candidate:
# `candidate` packs @wrkhse/sourcefed and attaches the tarball and its SHA256SUMS
# to a GitHub prerelease. A candidate never reaches npm, so people who install
# from npm only ever get a final release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact candidate version, e.g. 0.6.0-rc.3"
        required: true
        type: string
      tag:
        description: "Existing Git tag for that candidate, e.g. v0.6.0-rc.3"
        required: true
        type: string

# Each job asks for what it needs, so neither holds the other's rights.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  publish:
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 11.15.0 or later, for staged publishing
        run: npm install -g npm@^11.15.0
      - name: The tag names the package's version
        run: test "v$(node -p "require('./packages/sourcefed/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run check
      - name: Stage for approval
        working-directory: packages/sourcefed
        run: npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  candidate:
    if: ${{ github.event_name == 'push' && contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # npm ci runs install scripts, and this job's token can write releases, so
      # the token must not sit in .git/config where those scripts could read it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The tag names the package's version
        run: test "v$(node -p "require('./packages/sourcefed/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      # Builds packages/sourcefed/dist and its declarations, so the tarball
      # packed below holds exactly what was checked.
      - run: npm run check
      # npm pack does not create its destination folder.
      - name: Pack the candidate and its checksums
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          npm pack ./packages/sourcefed --pack-destination "$RUNNER_TEMP/candidate"
          cd "$RUNNER_TEMP/candidate"
          sha256sum *.tgz > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the GitHub prerelease
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
            --title "$GITHUB_REF_NAME" \
            --notes "A release candidate of @wrkhse/sourcefed. It is not on npm. Install it from the attached tarball after checking the tarball against SHA256SUMS." \
            "$RUNNER_TEMP"/candidate/*.tgz "$RUNNER_TEMP/candidate/SHA256SUMS"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # Manual, candidates only. Publishes the checksum-verified tarball from the
  # GitHub prerelease under the rc dist-tag with OIDC; latest is never moved.
  publish-rc:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    environment: release-rc
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate that the inputs name one candidate
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]] || {
            echo "::error::version must be a prerelease such as 0.6.0-rc.3, got '$VERSION'"
            exit 1
          }
          [[ "$TAG" == "v$VERSION" ]] || {
            echo "::error::tag must be v$VERSION, got '$TAG'"
            exit 1
          }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 11 for trusted publishing
        run: npm install -g npm@^11.15.0

      - name: Download the candidate tarball and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc"
          cd "$RUNNER_TEMP/rc"
          prerelease=$(gh release view "$TAG" --repo "$GH_REPO" --json isPrerelease --jq .isPrerelease)
          [[ "$prerelease" == "true" ]] || {
            echo "::error::$TAG is not a prerelease"
            exit 1
          }
          gh release download "$TAG" --repo "$GH_REPO" \
            --pattern "wrkhse-sourcefed-$VERSION.tgz" \
            --pattern "SHA256SUMS" \
            --dir "$RUNNER_TEMP/rc"
          test -f "wrkhse-sourcefed-$VERSION.tgz"
          test -f "SHA256SUMS"
          test "$(wc -l < SHA256SUMS)" -eq 1
          grep -Eq '^[0-9a-f]{64}  [^[:space:]]+\.tgz$' SHA256SUMS
          [[ "$(awk 'NR == 1 {print $2}' SHA256SUMS)" == "wrkhse-sourcefed-$VERSION.tgz" ]] || {
            echo "::error::SHA256SUMS does not name wrkhse-sourcefed-$VERSION.tgz"
            exit 1
          }
          shasum -a 256 -c SHA256SUMS

      - name: Refuse a version that is already on npm
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rc"
          npm view @wrkhse/sourcefed dist-tags.latest > "$RUNNER_TEMP/rc/latest-before.txt"
          integrity="sha512-$(openssl dgst -sha512 -binary "wrkhse-sourcefed-$VERSION.tgz" | openssl base64 -A)"
          if npm view "@wrkhse/sourcefed@$VERSION" dist.integrity > "$RUNNER_TEMP/rc/published-integrity.txt" 2> "$RUNNER_TEMP/rc/npm-view.err"; then
            published=$(cat "$RUNNER_TEMP/rc/published-integrity.txt")
            if [[ "$published" != "$integrity" ]]; then
              echo "::error::@wrkhse/sourcefed@$VERSION is already on npm with different bytes; refusing to publish"
              exit 1
            fi
            echo "::error::@wrkhse/sourcefed@$VERSION is already on npm; refusing to republish or change a dist-tag"
            exit 1
          fi
          grep -q 'E404' "$RUNNER_TEMP/rc/npm-view.err" || {
            echo "::error::could not check npm for an existing $VERSION"
            cat "$RUNNER_TEMP/rc/npm-view.err"
            exit 1
          }

      - name: Publish the verified tarball under rc
        working-directory: ${{ runner.temp }}/rc
        run: |
          set -euo pipefail
          [[ -z "${NODE_AUTH_TOKEN:-}" && -z "${NPM_TOKEN:-}" ]] || {
            echo "::error::the rc job publishes with OIDC only; no npm token is allowed"
            exit 1
          }
          npm publish "wrkhse-sourcefed-$VERSION.tgz" --tag rc --access public --provenance
          [[ "$(npm view @wrkhse/sourcefed dist-tags.latest)" == "$(cat "$RUNNER_TEMP/rc/latest-before.txt")" ]] || {
            echo "::error::publishing moved the latest dist-tag"
            exit 1
          }
          [[ "$(npm view @wrkhse/sourcefed dist-tags.rc)" == "$VERSION" ]] || {
            echo "::error::the rc dist-tag is not $VERSION after publishing"
            exit 1
          }
