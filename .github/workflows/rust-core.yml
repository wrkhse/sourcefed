name: rust-core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-10-25
          components: rustfmt, clippy
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2
        with:
          tool: cargo-nextest@0.9.152,cargo-deny@0.22.0
      - run: cargo fmt --all -- --check
      - name: Deny
        run: cargo deny check
      - run: >-
          cargo clippy --workspace --all-targets --all-features --locked
          -- -D warnings
      - run: cargo nextest run --workspace --all-features --locked
      - run: cargo test --workspace --doc --all-features --locked
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - run: cargo +1.100.0 check --workspace --locked
