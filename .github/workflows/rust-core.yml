name: rust-core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_tree:
        description: Run mutants over the full tree
        type: boolean
        default: false

permissions:
  contents: read

env:
  SOURCEFED_PROOF_SEED: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The reverted-fix proofs live beside the mutants gate.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect Rust changes
        id: diff
        shell: bash
        env:
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          base="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            echo "rust=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" HEAD -- \
            'rust/**/*.rs' \
            'rust/.cargo/mutants.toml' \
            'rust/Cargo.toml' \
            'rust/Cargo.lock' \
            'rust/rust-toolchain*' \
            'rust/clippy.toml')

          if [ -n "$changed" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = \(.*\)/\1/p' rust-toolchain.toml)
          channel=${channel//\"/}
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          workspaces: "rust -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2
        with:
          tool: cargo-nextest@0.9.152,cargo-deny@0.22.0
      - run: cargo fmt --all -- --check
      - name: Deny
        run: cargo deny check
      - run: >-
          cargo clippy --workspace --all-targets --all-features --locked
          -- -D warnings
      - run: cargo nextest run --workspace --all-features --locked
      - run: cargo test --workspace --doc --all-features --locked
      - name: Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - run: cargo +1.100.0 check --workspace --locked

  reverted-fix:
    name: Reverted fix (${{ matrix.proof }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - proof: clock-fallback
            seed: c10c000000000001
            steps: 28
            guarantee: ClockFaultsFailClosed
          - proof: temp-cleanup
            seed: 1
            steps: 8
            guarantee: BoundedCleanup
          - proof: stdin-handoff
            seed: 1
            test: raw_input::tests::a_held_ack_is_applied_when_the_run_halts_in_the_handoff
            guarantee: AtLeastOnceDelivery
          - proof: overlong-line
            seed: 1
            test: raw_input::tests::an_overlong_line_is_discarded_and_the_next_ack_applied
            guarantee: AtLeastOnceDelivery
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = \(.*\)/\1/p' rust-toolchain.toml)
          channel=${channel//\"/}
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Control (clean tree upholds the guarantee)
        shell: bash --noprofile --norc {0}
        env:
          SOURCEFED_COMMIT: ${{ github.sha }}
          SOURCEFED_PROOF_SEED: ${{ matrix.seed }}
        run: |
          set -uo pipefail
          if [ -n '${{ matrix.test }}' ]; then
            output=$(cargo test -p sourcefed-sim --bin sourcefed-sim --locked -- \
              --exact '${{ matrix.test }}' 2>&1)
            status=$?
            echo "$output"
            if [ "$status" -ne 0 ]; then
              echo "::error::control: ${{ matrix.proof }} test exit=$status"
              exit 1
            fi
            if ! printf '%s\n' "$output" \
              | grep -Fq 'test result: ok. 1 passed'; then
              echo "::error::control: ${{ matrix.proof }} did not run one test"
              exit 1
            fi
          else
            cargo run --quiet --bin sourcefed-sim --locked -- \
              --seed ${{ matrix.seed }} --steps ${{ matrix.steps }}
          fi
      - name: Revert the fix
        working-directory: .
        run: git apply rust/sim/reverted-fixes/${{ matrix.proof }}.patch
      - name: Reverted fix violates the guarantee
        shell: bash --noprofile --norc {0}
        env:
          SOURCEFED_COMMIT: ${{ github.sha }}
          SOURCEFED_PROOF_SEED: ${{ matrix.seed }}
        run: |
          set -uo pipefail
          if [ -n '${{ matrix.test }}' ]; then
            output=$(cargo test -p sourcefed-sim --bin sourcefed-sim --locked -- \
              --exact '${{ matrix.test }}' 2>&1)
            status=$?
            echo "$output"
            if [ "$status" -ne 101 ]; then
              echo "::error::reverted-fix: ${{ matrix.proof }} exit=$status, want 101"
              exit 1
            fi
            printf -v padded_seed '%016s' '${{ matrix.seed }}'
            padded_seed=${padded_seed// /0}
            expected="^sourcefed-sim: seed=$padded_seed commit=${{ github.sha }}"
            expected+=' violation=${{ matrix.guarantee }}: '
            if ! printf '%s\n' "$output" | grep -Eq "$expected"; then
              echo "::error::reverted-fix: $expected absent in ${{ matrix.proof }}"
              exit 1
            fi
            found=$(printf '%s\n' "$output" \
              | grep -Ec '^sourcefed-sim: seed=.* commit=.* violation=') || found=0
            if [ "$found" -ne 1 ]; then
              echo "::error::reverted-fix: ${{ matrix.proof }} found=$found"
              exit 1
            fi
          else
            output=$(cargo run --quiet --bin sourcefed-sim --locked -- \
              --seed ${{ matrix.seed }} --steps ${{ matrix.steps }} 2>&1)
            status=$?
            echo "$output"
            if [ "$status" -eq 0 ]; then
              echo "::error::reverted-fix: ${{ matrix.proof }} unexpectedly passed"
              exit 1
            fi
            if [ "$status" -ne 1 ]; then
              echo "::error::reverted-fix: ${{ matrix.proof }} exit=$status, want 1"
              exit 1
            fi
            printf -v padded_seed '%016s' '${{ matrix.seed }}'
            padded_seed=${padded_seed// /0}
            expected="^sourcefed-sim: seed=$padded_seed commit=${{ github.sha }}"
            expected+=' violation=${{ matrix.guarantee }}: '
            if ! printf '%s\n' "$output" | grep -Eq "$expected"; then
              echo "::error::reverted-fix: $expected absent in ${{ matrix.proof }}"
              exit 1
            fi
            violations=$(printf '%s\n' "$output" \
              | grep -Ec '^sourcefed-sim: seed=.* commit=.* violation=') || violations=0
            if [ "$violations" -ne 1 ]; then
              echo "::error::reverted-fix: ${{ matrix.proof }} violations=$violations"
              exit 1
            fi
          fi

  # Every viable mutant in the lines a pull request changes must be caught; an
  # equivalent one is excluded in .cargo/mutants.toml, with why. A dispatched
  # run on a branch uses the diff by default, or the full tree with full_tree;
  # see wrkhse/sourcefed#117.
  mutants-shard:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || needs.changes.outputs.rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FULL_TREE: ${{ github.event_name == 'push' || inputs.full_tree == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned toolchain
        working-directory: rust
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal \
            --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          workspaces: "rust -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: >- # v2.90.4
          taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.152
      - name: Compute the pull request diff
        if: ${{ env.FULL_TREE == 'false' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          base="${BASE_SHA:-origin/main}"
          git diff --relative=rust "$base"...HEAD -- 'rust/**/*.rs' > rust/pr.diff
          changed=$(git diff --name-only --relative=rust "$base"...HEAD \
            -- 'rust/**/*.rs')
          if [ -n "$changed" ] && [ ! -s rust/pr.diff ]; then
            echo "::error::mutants-diff: changed Rust files produced no diff"
            exit 1
          fi
          wc -l rust/pr.diff
      # A missed mutant or a timeout fails. One that truly hangs the tests is
      # excluded by name in .cargo/mutants.toml, with its reason.
      - name: Mutants
        shell: bash
        working-directory: rust
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail

          args=(--no-shuffle -j 2 --shard "$SHARD/4")
          if [[ "$FULL_TREE" == "false" ]]; then
            args+=(--in-diff pr.diff)
          fi

          if [[ "$FULL_TREE" == "false" ]] && [ ! -s pr.diff ]; then
            mkdir -p mutants.out
            printf '%s\n' '{"total_mutants":0,"caught":0,"missed":0,"timeout":0,"unviable":0}' > mutants.out/outcomes.json
            echo "No mutants in the diff for shard $SHARD"
            exit 0
          fi

          cargo mutants "${args[@]}" -vV
      - name: Confirm outcomes
        shell: bash
        working-directory: rust
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail

          mkdir -p mutants.out
          args=(--no-shuffle -j 2 --shard "$SHARD/4")
          if [[ "$FULL_TREE" == "false" ]]; then
            args+=(--in-diff pr.diff)
          fi

          if ! cargo mutants "${args[@]}" --list \
            > "listed-$SHARD.txt"; then
            echo "::error::mutants-shard-list: cargo mutants --list failed for shard $SHARD"
            exit 1
          fi

          if [ -f mutants.out/outcomes.json ]; then
            exit 0
          fi

          if [ ! -s "listed-$SHARD.txt" ]; then
            printf '%s\n' '{"total_mutants":0,"caught":0,"missed":0,"timeout":0,"unviable":0}' > mutants.out/outcomes.json
            exit 0
          fi

          echo "::error::mutants-shard-outcomes: shard $SHARD listed mutants but wrote no outcomes.json"
          exit 1
      - name: Check outcomes
        shell: bash
        working-directory: rust
        run: |
          set -euo pipefail

          jq -e '.missed == 0 and .timeout == 0' mutants.out/outcomes.json
      - name: What was tested
        if: always()
        shell: bash
        working-directory: rust
        run: |
          {
            echo "### Mutants shard ${{ matrix.shard }}"
            if [ -f mutants.out/outcomes.json ]; then
              jq -r '"- tested: \(.total_mutants)", "- caught: \(.caught)", "- missed: \(.missed)", "- timeouts: \(.timeout)", "- unviable: \(.unviable)"' mutants.out/outcomes.json
            else
              echo "- no outcomes"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: >- # v7.0.2
          actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: rust/mutants.out/outcomes.json
          if-no-files-found: error
      - if: always()
        uses: >- # v7.0.2
          actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutants-listed-${{ matrix.shard }}
          path: rust/listed-${{ matrix.shard }}.txt
          if-no-files-found: warn

  mutants:
    needs: [changes, mutants-shard]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FULL_TREE: ${{ github.event_name == 'push' || inputs.full_tree == true }}
    steps:
      - name: Download shard outcomes
        uses: >- # v4.3.0
          actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mutants-shard-*
          path: ${{ runner.temp }}/mutants-shards
      - name: Download shard lists
        uses: >- # v4.3.0
          actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mutants-listed-*
          path: ${{ runner.temp }}/mutants-listed/listed
      - name: Check shard outcomes
        shell: bash
        env:
          ARTIFACTS: ${{ runner.temp }}/mutants-shards
        run: |
          set -euo pipefail

          if [ "${{ needs.mutants-shard.result }}" != "success" ]; then
            echo "::error::mutants-shards: at least one shard failed"
            exit 1
          fi

          mapfile -t outcomes < <(find "$ARTIFACTS" -name outcomes.json -type f)
          if [ "${#outcomes[@]}" -ne 4 ]; then
            echo "::error::mutants-shards: expected 4 outcomes.json files, found ${#outcomes[@]}"
            exit 1
          fi

          total=0
          caught=0
          for outcome in "${outcomes[@]}"; do
            if ! jq -e '.missed == 0 and .timeout == 0' "$outcome" > /dev/null; then
              echo "::error::mutants-shards: $outcome has missed or timed-out mutants"
              exit 1
            fi
            total=$((total + $(jq -r '.total_mutants' "$outcome")))
            caught=$((caught + $(jq -r '.caught' "$outcome")))
          done

          echo "TOTAL_MUTANTS=$total" >> "$GITHUB_ENV"
          echo "CAUGHT_MUTANTS=$caught" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned toolchain
        working-directory: rust
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal \
            --component rustfmt --component clippy
      - uses: >- # v2.90.4
          taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.152
      - name: Compute the pull request diff
        if: ${{ env.FULL_TREE == 'false' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          base="${BASE_SHA:-origin/main}"
          git diff --relative=rust "$base"...HEAD -- 'rust/**/*.rs' > rust/pr.diff
          changed=$(git diff --name-only --relative=rust "$base"...HEAD \
            -- 'rust/**/*.rs')
          if [ -n "$changed" ] && [ ! -s rust/pr.diff ]; then
            echo "::error::mutants-diff: changed Rust files produced no diff"
            exit 1
          fi
          wc -l rust/pr.diff
      - name: Check shard coverage
        shell: bash
        working-directory: rust
        env:
          LISTED: ${{ runner.temp }}/mutants-listed/listed
        run: |
          set -euo pipefail

          args=(--no-shuffle -j 2)
          if [[ "$FULL_TREE" == "false" ]]; then
            args+=(--in-diff pr.diff)
          fi

          if ! cargo mutants "${args[@]}" --list > listed.txt; then
            echo "::error::mutants-list: cargo mutants --list failed"
            exit 1
          fi

          listed=$(wc -l < listed.txt)
          if [ "$listed" -ne "$TOTAL_MUTANTS" ]; then
            echo "::error::mutants-coverage: shards covered $TOTAL_MUTANTS mutants, the full list has $listed"
            exit 1
          fi

          mapfile -t shard_lists < <(find "$LISTED" -name 'listed-*.txt' -type f)
          if [ "${#shard_lists[@]}" -ne 4 ]; then
            echo "::error::mutants-identities: expected 4 lists, found ${#shard_lists[@]}"
            exit 1
          fi
          cat "${shard_lists[@]}" | sort > shard-listed.txt
          sort listed.txt > full-listed.txt
          if ! diff -u full-listed.txt shard-listed.txt; then
            echo "::error::mutants-identities: shard lists differ from the full list"
            exit 1
          fi
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Mutants"
            echo "- shards: 4"
            echo "- tested: ${TOTAL_MUTANTS:-unknown}"
            echo "- caught: ${CAUGHT_MUTANTS:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"

  drain-loop:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = \(.*\)/\1/p' rust-toolchain.toml)
          channel=${channel//\"/}
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          workspaces: "rust -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2
        with:
          tool: cargo-nextest@0.9.152,cargo-deny@0.22.0
      - name: Full-queue drain 50x
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          for i in $(seq 1 50); do
            echo "iteration $i"
            if output=$(cargo test -p sourcefed-cli --lib --locked -- \
              --exact 'tests::finish_applies_a_full_queue_the_reader_left_when_the_run_ends' 2>&1); then
              status=0
            else
              status=$?
            fi
            echo "$output"
            if [ "$status" -ne 0 ]; then
              echo "iteration $i failed (exit=$status)"
              failures=$((failures + 1))
            elif ! printf '%s\n' "$output" | grep -Fq '1 passed; 0 failed'; then
              echo "iteration $i failed (test did not run: no '1 passed; 0 failed' in output)"
              failures=$((failures + 1))
            fi
          done

          pct=$((failures * 100 / 50))
          summary="drain loop: $failures/50 failed ($pct%)"
          echo "$summary"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"

          if [ "$failures" -gt 0 ]; then
            exit 1
          fi
