name: rust-core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = \(.*\)/\1/p' rust-toolchain.toml)
          channel=${channel//\"/}
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2
        with:
          tool: cargo-nextest@0.9.152,cargo-deny@0.22.0
      - run: cargo fmt --all -- --check
      - name: Deny
        run: cargo deny check
      - run: >-
          cargo clippy --workspace --all-targets --all-features --locked
          -- -D warnings
      - run: cargo nextest run --workspace --all-features --locked
      - run: cargo test --workspace --doc --all-features --locked
      - name: Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - run: cargo +1.100.0 check --workspace --locked

  # Fixed seeds drive the simulator through its real CLI path on every push.
  seeded-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = \(.*\)/\1/p' rust-toolchain.toml)
          channel=${channel//\"/}
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2
        with:
          tool: cargo-nextest@0.9.152,cargo-deny@0.22.0
      - name: Run seeded simulations
        timeout-minutes: 15
        env:
          SOURCEFED_SIM_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          for seed in 0000000000000023 0000000000000031; do
            cargo run --locked -p sourcefed-sim -- \
              --seed "$seed" --steps 20 > "$RUNNER_TEMP/$seed.first"
            cargo run --locked -p sourcefed-sim -- \
              --seed "$seed" --steps 20 > "$RUNNER_TEMP/$seed.second"
            cmp "$RUNNER_TEMP/$seed.first" "$RUNNER_TEMP/$seed.second"
          done

  # Every viable mutant in the lines a pull request changes must be caught; an
  # equivalent one is excluded in .cargo/mutants.toml, with why. A dispatched
  # run repeats it on a branch, diffed against main, to check the gate itself.
  mutants:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned toolchain
        working-directory: rust
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal \
            --component rustfmt --component clippy
      - uses: >- # v2.90.4
          taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.152
      - name: Compute the pull request diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          base="${BASE_SHA:-origin/main}"
          git diff --relative=rust "$base"...HEAD -- 'rust/**/*.rs' > rust/pr.diff
          wc -l rust/pr.diff
      # A missed mutant or a timeout fails. One that truly hangs the tests is
      # excluded by name in .cargo/mutants.toml, with its reason.
      - run: cargo mutants --in-diff pr.diff --no-shuffle -j 2 -vV
        working-directory: rust
      - name: What was tested
        if: always()
        working-directory: rust
        run: |
          {
            echo "### Mutants"
            if [ -f mutants.out/outcomes.json ]; then
              jq -r '
                "- tested: \(.total_mutants)",
                "- caught: \(.caught)",
                "- missed: \(.missed)",
                "- timeouts: \(.timeout)",
                "- unviable: \(.unviable)"
              ' mutants.out/outcomes.json
            else
              echo "- none in this diff"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: >- # v7.0.2
          actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutants.out
          path: rust/mutants.out
          if-no-files-found: ignore
