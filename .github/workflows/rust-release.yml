name: rust-release

# A tag such as core-v0.1.0-rc.1 names a release candidate of sourcefed-core,
# the Rust binary built from the sourcefed-cli package. `build` checks the tag
# against the package version, builds the binary and smoke-tests its tarball;
# `recording` films the packed binary delivering, acknowledging and not
# redelivering an event across a restart; `release` attaches the tarball, the
# demo GIF and their SHA256SUMS to a GitHub prerelease that is never latest.
#
# A dispatch names an existing tag and runs the same jobs against it, so a
# release's assets are rebuilt and replaced without a new tag or release.

on:
  push:
    tags: ["core-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to rebuild, such as core-v0.1.0-rc.1
        required: true
        type: string

# Each job asks for what it needs; only `release` writes.
permissions:
  contents: read

concurrency:
  group: rust-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  TAG: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.tag
    || github.ref_name }}
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      # A dispatch runs on a branch, so the tag is checked out by name; a
      # tag that does not exist fails here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - name: The tag names the sourcefed-cli version
        run: |
          set -euo pipefail

          version=$(cargo +1.100.0 metadata --locked --no-deps \
            --format-version 1 |
            jq -r '.packages[] | select(.name == "sourcefed-cli") | .version')
          [[ "$version" == "${TAG#core-v}" ]] || {
            echo "::error::sourcefed-cli is $version, the tag is $TAG"
            exit 1
          }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ARCHIVE=sourcefed-core-$version-$TARGET.tar.gz" >> "$GITHUB_ENV"
      - run: cargo +1.100.0 build --release --locked -p sourcefed-cli
      - name: Pack the binary
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/dist"
          tar -czf "$RUNNER_TEMP/dist/$ARCHIVE" -C target/release sourcefed-core
          tar -tzvf "$RUNNER_TEMP/dist/$ARCHIVE"
      # Runs the binary from the tarball, outside the checkout, the way a
      # person who downloads it would.
      - name: Smoke-test the packed binary
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail

          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          tar -xzf "$RUNNER_TEMP/dist/$ARCHIVE" -C "$work"
          cd "$work"

          printed=$(./sourcefed-core --version)
          [[ "$printed" == "sourcefed-core $VERSION" ]] || {
            echo "::error::--version printed '$printed'"
            exit 1
          }

          # The first poll saves the next firing; a later one prints it.
          timeout 30 ./sourcefed-core follow --job smoke --every 1 \
            --state-dir "$work/state" --max-polls 3 \
            < /dev/null > events.jsonl
          cat events.jsonl
          jq -e -s 'any(.[]; .kind == "timer.fired")' events.jsonl

          if ! jq -e -s '[.[] | select(.kind == "timer.fired") | .id]
            | length == (unique | length)' events.jsonl > /dev/null; then
            echo "::error::a timer.fired id appears more than once"
            exit 1
          fi
      - uses: >- # v7.0.2
          actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sourcefed-core-tarball
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error

  # Films the packed binary end to end in two sessions that share one state
  # directory: `run` prints a timer.fired event, acks it and stops; `restart`
  # follows again and must not print the acked ID. The two takes join into
  # one GIF, a release asset only; it is never committed.
  recording:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: >- # v4.3.0
          actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sourcefed-core-tarball
          path: ${{ runner.temp }}/dist
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      # terminal-control builds its Ghostty core with Zig 0.15.2.
      - name: Install Zig 0.15.2
        env:
          ZIG_SHA256: >-
            02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
        run: |
          set -euo pipefail

          url=https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" "$url"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
      # The runner has no monospace font, and a video rendered without one
      # shows no glyphs, so the font the videos name is installed and found.
      # ImageMagick measures the exported GIF; Tesseract reads each take.
      - name: Install termctrl 1.2.1, ffmpeg, ImageMagick, Tesseract and DejaVu
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fontconfig fonts-dejavu-core imagemagick \
            tesseract-ocr tesseract-ocr-eng
          family=$(fc-match -f '%{family}' 'DejaVu Sans Mono')
          [[ "$family" == *"DejaVu Sans Mono"* ]] || {
            echo "::error::fontconfig matched '$family' for DejaVu Sans Mono"
            exit 1
          }
          cargo +1.100.0 install terminal-control --version 1.2.1 --locked
          termctrl --version
      - name: Record a run that acks an event, then a restart
        run: |
          set -euo pipefail

          work=$(mktemp -d)
          run_live=
          restart_live=

          # A command that fails in an EXIT trap leaves the step's result as
          # it was. cleanup returns the incoming status, or 1 when a live
          # session fails to stop or the folder stays; the trap exits with
          # the incoming status, or 1 when cleanup returns nonzero.
          cleanup() {
            local status=$1

            if [[ -n $run_live ]] && ! termctrl stop run; then
              echo "::error::termctrl stop run failed"
              status=1
            fi

            if [[ -n $restart_live ]] && ! termctrl stop restart; then
              echo "::error::termctrl stop restart failed"
              status=1
            fi

            if ! rm -rf "$work"; then
              echo "::error::could not remove $work"
              status=1
            fi

            return "$status"
          }
          trap 'status=$?; cleanup "$status" || status=1; exit "$status"' EXIT
          tar -xzf "$RUNNER_TEMP"/dist/*.tar.gz -C "$work"
          mkdir -p artifacts

          # Shows the command, runs it in the shared state directory, prints
          # its exit status and keeps the screen until the session stops.
          cat > "$work/follow.sh" <<'SH'
          cmd=(./sourcefed-core follow --job demo --every 1 --state-dir state
            --max-polls "$1")
          echo "\$ ${cmd[*]}"
          "${cmd[@]}"
          echo "sourcefed-core exited with $?"
          read -r _
          SH

          # Readable output with wrapped lines joined, so an ID split across
          # rows still matches.
          joined() {
            termctrl logs "$1" | tr -d '\r\n'
          }

          # An event ID ends at its instant's Z, so the colon after the ID in
          # the ack log line is never part of a match.
          id_pattern='timer:demo:[0-9T:.-]+Z'

          # Prints the recording's screen at the marker and fails unless it
          # shows the text, rows joined so a wrapped ID still matches. A take
          # whose frames lack the output it filmed stops the job.
          frame_shows() {
            local recording=$1 marker=$2 expected=$3 frame
            frame=$(termctrl show --recording "$recording" --at-marker "$marker")
            printf -- '--- %s at %s ---\n%s\n' "$recording" "$marker" "$frame"
            if [[ $(tr -d '\n' <<< "$frame") != *"$expected"* ]]; then
              echo "::error::$recording at $marker does not show $expected"
              return 1
            fi
          }

          # Prints each distinct event ID in stdin, sorted. awk and sort
          # succeed when nothing matches.
          event_ids() {
            awk -v pattern="$id_pattern" '{
              while (match($0, pattern)) {
                print substr($0, RSTART, RLENGTH)
                $0 = substr($0, RSTART + RLENGTH)
              }
            }' | sort -u
          }

          # Prints the first event ID other than $1 in the run's output,
          # checking every 0.2 seconds for at most ten seconds.
          another_id() {
            local ids other
            for _ in {1..50}; do
              ids=$(joined run | event_ids) || return
              other=$(awk -v first="$1" '$0 != first' <<< "$ids" | sed -n 1p)
              if [[ -n $other ]]; then
                echo "$other"
                return 0
              fi

              sleep 0.2
            done

            return 1
          }

          # How often $1 occurs in $2. grep exits 1 when nothing matches,
          # which counts as zero; any other failure is returned.
          occurrences() {
            local matches status=0
            matches=$(grep -oF -- "$1" <<< "$2") || status=$?
            if (( status > 1 )); then
              return "$status"
            fi

            if [[ -z $matches ]]; then
              echo 0
            else
              wc -l <<< "$matches"
            fi
          }

          termctrl start run --record artifacts/run.termctrl \
            --cols 120 --rows 16 --cwd "$work" -- bash ./follow.sh 30
          run_live=1
          termctrl mark run start
          termctrl wait run timer.fired --timeout 30000
          termctrl mark run fired

          if ! id=$(termctrl logs run | tr -d '\r\n' |
            grep -oE "$id_pattern" | sed -n 1p) || [[ -z "$id" ]]
          then
            echo "::error::no event ID on the run's screen"
            exit 1
          fi

          # Another firing prints before the ack is sent, so the run keeps
          # an event it never acks without waiting on a later poll.
          if ! second=$(another_id "$id"); then
            echo "::error::no second event ID on the run's screen"
            exit 1
          fi
          echo "second event $second"
          printed=$(joined run | event_ids)
          echo "acking $id"

          termctrl send run "text:ack $id" enter
          termctrl wait run "1 event(s) removed" --timeout 10000
          termctrl mark run acked

          # Every ID printed before the ack, except the acked one.
          unacked=$(awk -v acked="$id" '$0 != acked' <<< "$printed")
          if [[ -z "$unacked" ]]; then
            echo "::error::the run printed no unacknowledged timer.fired event"
            exit 1
          fi
          printf 'unacknowledged:\n%s\n' "$unacked"
          mapfile -t pending_ids <<< "$unacked"

          termctrl send run text:stop enter
          termctrl wait run "sourcefed-core exited with" --timeout 10000
          termctrl mark run stopped
          run=$(joined run)
          termctrl stop run
          run_live=
          [[ "$run" == *"sourcefed-core exited with 0"* ]] || {
            echo "::error::the run did not exit cleanly"
            exit 1
          }
          frame_shows artifacts/run.termctrl fired timer.fired
          frame_shows artifacts/run.termctrl acked "1 event(s) removed"

          # Downtime: the run saved the next due instant, at most a second
          # ahead, so firings come due while no CLI runs.
          sleep 3
          restart_started=$(date -u +%Y-%m-%dT%H:%M:%S)

          # The same poll budget as the run, so every pending event can
          # return; the first poll prints them all, then stop ends it.
          termctrl start restart --record artifacts/restart.termctrl \
            --cols 120 --rows 16 --cwd "$work" -- bash ./follow.sh 30
          restart_live=1
          termctrl mark restart start
          for pending in "${pending_ids[@]}"; do
            termctrl wait restart "$pending" --timeout 30000
          done
          termctrl mark restart delivered
          termctrl send restart text:stop enter
          termctrl wait restart "sourcefed-core exited with" --timeout 10000
          termctrl mark restart finished
          restart=$(joined restart)
          termctrl stop restart
          restart_live=
          printf '%s\n' "$restart"
          [[ "$restart" == *"sourcefed-core exited with 0"* ]] || {
            echo "::error::the restart did not exit cleanly"
            exit 1
          }

          # The last pending ID waited for is on screen when delivered is
          # marked; earlier ones may have scrolled off the 16 rows.
          frame_shows artifacts/restart.termctrl delivered "${pending_ids[-1]}"
          [[ "$restart" != *"$id"* ]] || {
            echo "::error::the restart delivered the acked $id again"
            exit 1
          }

          for pending in "${pending_ids[@]}"; do
            count=$(occurrences "$pending" "$restart")
            if (( count == 0 )); then
              echo "::error::the restart did not deliver unacknowledged $pending"
              exit 1
            fi

            if (( count != 1 )); then
              echo "::error::the restart delivered $pending $count times"
              exit 1
            fi
          done

          # A firing from the downtime is an ID the run never printed whose
          # instant is before the restart started; a timer.missed event
          # carries the same ID form.
          run_ids=$(event_ids <<< "$run")
          restart_ids=$(event_ids <<< "$restart")
          downtime=
          while IFS= read -r fresh; do
            if [[ $'\n'$run_ids$'\n' == *$'\n'"$fresh"$'\n'* ]]; then
              continue
            fi

            if [[ ${fresh#timer:demo:} < "$restart_started" ]]; then
              downtime=$fresh
              break
            fi
          done <<< "$restart_ids"

          if [[ -z $downtime ]]; then
            echo "::error::the restart delivered no firing from the downtime"
            exit 1
          fi
          echo "downtime firing $downtime"

          termctrl markers artifacts/run.termctrl
          termctrl markers artifacts/restart.termctrl
      # Each take exports with its captions and holds, the two join into one
      # clip, and the clip becomes a GIF of at most 1200 pixels wide and
      # 3 MB. The restart's 3.5 second tail is the GIF's final hold.
      - name: Export the demo GIF
        run: |
          set -euo pipefail

          cat > artifacts/run-edit.json <<'JSON'
          {
            "clips": [
              {
                "from": "start",
                "to": "fired",
                "caption": "follow prints a timer.fired event as one JSON line",
                "hold_ms": 2500
              },
              {
                "from": "fired",
                "to": "acked",
                "caption": "ack <event id> removes that event from the store",
                "hold_ms": 2500
              },
              {
                "from": "acked",
                "to": "stopped",
                "caption": "stop ends the run; the state directory remains",
                "hold_ms": 2500
              }
            ]
          }
          JSON
          cat > artifacts/restart-edit.json <<'JSON'
          {
            "clips": [
              {
                "from": "start",
                "to": "delivered",
                "caption": "Restart on the same state: pending events return",
                "hold_ms": 2500
              },
              {
                "from": "delivered",
                "to": "finished",
                "caption": "The acked event is never delivered again",
                "hold_ms": 2500
              }
            ]
          }
          JSON

          for take in run restart; do
            termctrl video "artifacts/$take.termctrl" \
              --edit "artifacts/$take-edit.json" --footer --fps 10 \
              --font-family "DejaVu Sans Mono" \
              --tail-ms 3500 --out "artifacts/demo-$take.mp4"
          done
          ls -l artifacts/*.mp4

          # Prints the time in milliseconds of the recording's marker, or
          # fails when the recording has no such marker. It runs inside $(),
          # so the error goes to stderr to reach the log.
          marker_ms() {
            local ms
            ms=$(termctrl markers "$1" |
              awk -v name="$2" '$2 == name && !found { print $1; found = 1 }')
            if [[ -z $ms ]]; then
              echo "::error::$1 has no $2 marker" >&2
              return 1
            fi

            echo "$ms"
          }

          # OCR reads each take at its first firing, so both takes, not only
          # the GIF's last frame, show their text. The frame is halfway
          # through the hold after the take's first clip; the footer, whose
          # caption can name timer.fired, is cropped off, and the spaces OCR
          # puts inside a word are dropped. ffmpeg writes no frame past the
          # end of a video and still succeeds, so the frame is checked.
          for take in run:fired restart:delivered; do
            name=${take%%:*}
            recording="artifacts/$name.termctrl"
            start=$(marker_ms "$recording" start)
            shown=$(marker_ms "$recording" "${take#*:}")
            at=$(( shown - start + 1250 ))
            seek=$(printf '%d.%03d' $(( at / 1000 )) $(( at % 1000 )))
            frame="artifacts/ocr-$name.png"
            rm -f -- "$frame"
            ffmpeg -hide_banner -loglevel error -y -ss "$seek" \
              -i "artifacts/demo-$name.mp4" -frames:v 1 \
              -vf 'crop=iw:ih*3/4:0:0,format=gray,negate' "$frame"
            if [[ ! -s $frame ]]; then
              echo "::error::demo-$name.mp4 has no frame at $seek s"
              exit 1
            fi

            text=$(tesseract "$frame" stdout)
            printf -- '--- OCR of demo-%s.mp4 at %s s ---\n%s\n' \
              "$name" "$seek" "$text"
            if [[ $(tr -d '[:space:]' <<< "$text") != *timer.fired* ]]; then
              echo "::error::OCR finds no timer.fired in demo-$name.mp4 at $seek s"
              exit 1
            fi
          done

          # Both takes have the same terminal size, so their frames match.
          ffmpeg -hide_banner -loglevel error -y \
            -i artifacts/demo-run.mp4 -i artifacts/demo-restart.mp4 \
            -filter_complex '[0:v][1:v]concat=n=2:v=1:a=0[v]' -map '[v]' \
            -c:v libx264 -pix_fmt yuv420p artifacts/demo.mp4

          # Narrower takes until one fits under 3 MB; none fitting fails.
          limit=$((3 * 1024 * 1024))
          size=$limit
          for width in 1200 1000 800; do
            filter="fps=10,scale='min($width,iw)':-2:flags=lanczos,split[a][b]"
            filter+=";[a]palettegen=stats_mode=diff[p]"
            filter+=";[b][p]paletteuse=dither=bayer:bayer_scale=5"
            filter+=":diff_mode=rectangle"
            ffmpeg -hide_banner -loglevel error -y -i artifacts/demo.mp4 \
              -filter_complex "$filter" -loop 0 artifacts/demo.gif
            size=$(stat -c %s artifacts/demo.gif)
            echo "demo.gif at most $width pixels wide: $size bytes"
            if (( size < limit )); then
              break
            fi
          done

          if (( size >= limit )); then
            echo "::error::demo.gif is $size bytes even at 800 pixels wide"
            exit 1
          fi

          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height:format=duration \
            -of default=noprint_wrappers=1 artifacts/demo.gif
          gif_width=$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=width -of csv=p=0 artifacts/demo.gif)
          if (( gif_width > 1200 )); then
            echo "::error::demo.gif is $gif_width pixels wide"
            exit 1
          fi

          # The final hold shows the restart's output. A frame of text
          # measures about 0.04 or more in grayscale standard deviation (0 to
          # 1); a dark frame with only a cursor, about 0.01. Below 0.02 the
          # GIF rendered no glyphs.
          ffmpeg -hide_banner -loglevel error -y -sseof -1 \
            -i artifacts/demo.gif -frames:v 1 artifacts/demo-last.png
          deviation=$(convert artifacts/demo-last.png -colorspace Gray \
            -format '%[fx:standard_deviation]' info:)
          echo "demo.gif final frame grayscale deviation: $deviation"
          if ! awk -v d="$deviation" 'BEGIN { exit !(d >= 0.02) }'; then
            echo "::error::demo.gif's final frame is blank (deviation $deviation)"
            exit 1
          fi
      - uses: >- # v7.0.2
          actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: demo-recording
          path: artifacts/demo.gif
          if-no-files-found: error

  release:
    needs: [build, recording]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: >- # v4.3.0
          actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sourcefed-core-tarball
          path: ${{ runner.temp }}/release
      - uses: >- # v4.3.0
          actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: demo-recording
          path: ${{ runner.temp }}/release
      # A dispatch keeps the published tarball, so the rebuilt one gives way
      # to the release's own copy and the sums cover what is attached. A
      # dispatch on a tag with no release, or no tarball, fails here.
      - name: Write SHA256SUMS
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          tarballs=(*.tar.gz)
          if (( ${#tarballs[@]} != 1 )); then
            echo "::error::expected one tarball, found ${tarballs[*]}"
            exit 1
          fi
          tarball=${tarballs[0]}

          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            rm -- "$tarball"
            gh release download "$TAG" --pattern "$tarball" --dir .
          fi

          sha256sum -- "$tarball" demo.gif > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the GitHub prerelease
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          notes="A release candidate of sourcefed-core, the Rust core, for x86_64"
          notes+=" Linux. Check the tarball against SHA256SUMS, unpack it and run"
          notes+=" sourcefed-core --version. demo.gif shows this binary"
          notes+=" printing a timer.fired event and acking it, then a restart"
          notes+=" on the same state that never delivers it again."

          # A dispatch re-records the demo of a published tag, so it replaces
          # the GIF and the SHA256SUMS that covers it, and leaves the tarball
          # as it was.
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            assets=(SHA256SUMS demo.gif)
          else
            assets=(*.tar.gz SHA256SUMS demo.gif)
          fi

          # A rerun or a dispatch finds the release already made, so it
          # replaces the assets; only a new release is created, as a
          # prerelease.
          if gh release view "$TAG" > /dev/null; then
            gh release upload "$TAG" --clobber -- "${assets[@]}"
          else
            gh release create "$TAG" --prerelease --latest=false --verify-tag \
              --title "sourcefed-core $TAG" --notes "$notes" \
              -- "${assets[@]}"
          fi

          # A dispatch brings the release in line with what it attaches: the
          # notes name the GIF, and the videos an earlier run attached go.
          # The flags restate the release's kind, so editing keeps it.
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            gh release edit "$TAG" --prerelease --latest=false --notes "$notes"
            stale=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '
              .assets[].name
              | select(. == "demo-run.mp4" or . == "demo-restart.mp4")')
            while IFS= read -r name; do
              if [[ -z $name ]]; then
                continue
              fi

              echo "deleting the stale asset $name"
              gh release delete-asset "$TAG" "$name" --yes
            done <<< "$stale"
          fi
