name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The daemon the contract test runs against, from the same prerelease as the client tarball.
      # A contract test that skips because the fetch broke would prove nothing, so the test itself
      # fails when CHAUFFEUR_REQUIRED is set and CHAUFFEUR_BIN is not.
      - name: The pinned Chauffeur v2 daemon
        run: |
          curl -sSLo "$RUNNER_TEMP/chauffeur.tar.gz" "$CHAUFFEUR_TARBALL"
          echo "$CHAUFFEUR_SHA256  $RUNNER_TEMP/chauffeur.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/chauffeur"
          tar xzf "$RUNNER_TEMP/chauffeur.tar.gz" -C "$RUNNER_TEMP/chauffeur"
          echo "CHAUFFEUR_BIN=$RUNNER_TEMP/chauffeur/bin/chauffeur" >> "$GITHUB_ENV"
          echo "CHAUFFEUR_REQUIRED=1" >> "$GITHUB_ENV"
        env:
          CHAUFFEUR_TARBALL: https://github.com/wrkhse/chauffeur/releases/download/v1.0.0-rc.5/chauffeur-1.0.0-rc.5-linux-x64.tar.gz
          CHAUFFEUR_SHA256: 4f192618ccfa921ccd9540ad1a20f2da400d962b62513611bc07cbbecf3c717f
      - run: npm run check

  pi-integration:
    name: Pi integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:tui
      - run: npm run build:public
      - name: Pi integration on the locked development host
        run: |
          PATH="$PWD/node_modules/.bin:$PATH" node scripts/assert-pi-host.mjs
          npm run integration -- pi.test.mjs pi-package.test.mjs
      - name: Pi integration on the Pi 0.83.0 host
        env:
          LEGACY_PI: ${{ runner.temp }}/pi-0.83.0
        run: |
          npm install --prefix "$LEGACY_PI" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@0.83.0
          export PATH="$LEGACY_PI/node_modules/.bin:$PATH"
          node scripts/assert-pi-host.mjs 0.83.0
          node scripts/integration.mjs pi.test.mjs pi-package.test.mjs

  # The timer's restart proof runs a packed daemon, which stays off developers' Macs.
  timer-integration:
    name: Timer integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:tui
      - run: npm run build:public
      - run: npm run integration -- provider-timer.test.mjs

  # Formatting is checked by tidy, pinned by version and archive checksum.
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pinned tidy v2.0.0
        env:
          TIDY_RELEASE: https://github.com/lukeed/tidy/releases/download/v2.0.0
          TIDY_ASSET: tidy-x86_64-unknown-linux-musl.tar.gz
          TIDY_SHA: 4b8166b1cdde610fd783f2d59511b0fb35d15ef96069ef20642b948ab90907ea
        run: |
          archive="$RUNNER_TEMP/tidy.tar.gz"
          curl -fsSLo "$archive" "$TIDY_RELEASE/$TIDY_ASSET"
          echo "$TIDY_SHA  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tidy"
          tar xzf "$archive" -C "$RUNNER_TEMP/tidy"
          chmod +x "$RUNNER_TEMP/tidy/tidy"
          echo "$RUNNER_TEMP/tidy" >> "$GITHUB_PATH"
      # The default bash shell runs with -e, which would end the step at a
      # failing tidy before the status is reported. This shell has no -e; the
      # step still exits with tidy's own status.
      - name: tidy check
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          pathspecs=(
            '*.ts' '*.tsx' '*.mjs' '*.mts' '*.js' '*.cjs' '*.jsx' '*.json'
            '*.md' '*.yml' '*.yaml' '*.toml'
            # The build rewrites this bundle, so formatting it would leave
            # the tree dirty after check.
            ':(exclude)adapters/opencode/tui-compiled.mjs'
            # Release tooling rewrites the changelog.
            ':(exclude)CHANGELOG.md'
            # scripts/record-golden.mjs writes these fixtures.
            ':(exclude)**/fixtures/golden.ts'
          )
          file_list="$RUNNER_TEMP/tidy-files"
          if ! git ls-files -z -- "${pathspecs[@]}" > "$file_list"; then
            echo "::error::could not list tracked files"
            exit 2
          fi
          mapfile -d '' -t files < "$file_list"
          if (( ${#files[@]} == 0 )); then
            echo "::error::no tracked files matched the tidy check pathspecs"
            exit 2
          fi
          tidy check --skip-unknown "${files[@]}"
          status=$?
          case "$status" in
            0) ;;
            1) echo "::error::tidy check found unformatted files." ;;
            2) echo "::error::tidy check could not parse a file or its config." ;;
            *) echo "::error::tidy check exited with status $status." ;;
          esac
          exit "$status"
