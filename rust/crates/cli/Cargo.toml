[package]
name = "sourcefed-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sourcefed-core"
path = "src/main.rs"
# The binary shares its name with the core library, so only the library has docs.
doc = false

[features]
# Off by default, so the release CLI never ships the reader's hold gate.
# Only the simulator's raw-input tests enable it.
sim-seam = []

[dependencies]
sourcefed-core = { path = "../core", version = "0.1.0-rc.1" }
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
