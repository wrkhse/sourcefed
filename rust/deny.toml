[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Unlicense", "Unicode-3.0"]
unused-allowed-license = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
