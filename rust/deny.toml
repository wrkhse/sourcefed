[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Unlicense", "Unicode-3.0"]
unused-allowed-license = "deny"

[sources]
allow-git = [
  "https://github.com/wrkhse/tack?rev=197ba009f88e296a8cab28b82ebb3db2b33833fb",
]
unknown-registry = "deny"
unknown-git = "deny"
