[advisories]
yanked = "deny"

[bans]
wildcards = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # SPDX names the Unicode DFS 2016 licence this way.
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
]
# The allowlist is policy, not an inventory of the current dependency graph.
unused-allowed-license = "allow"
